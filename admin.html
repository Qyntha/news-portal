<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户中心 - 相思门户网</title>
  <meta name="description" content="相思门户网用户中心——个人中心、创作者中心与管理面板。" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#eef2fb',
              100: '#dbe3f5',
              200: '#b6c4e8',
              300: '#8aa0d6',
              400: '#5a77c0',
              500: '#35539f',
              DEFAULT: '#1e3a8a',
              600: '#1e3a8a',
              700: '#173071',
              800: '#122658',
              900: '#0d1c42'
            },
            accent: {
              DEFAULT: '#f59e0b',
              light: '#fbbf24'
            }
          },
          fontFamily: {
            sans: ['"PingFang SC"', '"Microsoft YaHei"', '"Hiragino Sans GB"', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            card: '0 1px 3px rgba(13,28,66,.06), 0 8px 24px rgba(13,28,66,.06)'
          }
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body { -webkit-font-smoothing: antialiased; }

    /* 顶部导航栏下方悬浮热词条 */
    .hotbar {
      position: sticky;
      top: 0;
      z-index: 30;
    }
  </style>
  <script src="data.js"></script>
  <script src="api.js"></script>
  <script>
    // 登录保护：未登录用户自动跳转回首页（普通用户可查看个人中心，但看不到创作者/管理模块）
    if (localStorage.getItem('isLoggedIn') !== 'true') {
      window.location.replace('index.html');
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

  <!-- ===== 顶部服务条（公告） ===== -->
  <div class="bg-brand-900 text-brand-100 text-xs">
    <div class="max-w-7xl mx-auto px-4 h-9 flex items-center justify-between gap-4">
      <div class="flex-1 min-w-0 flex items-center">
        <div id="announcement-bar" class="flex-1 min-w-0 flex items-center">
          <span id="announcement-text" class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-accent shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            <span id="announcement-content" class="truncate"></span>
          </span>
        </div>
      </div>
      <div class="flex items-center gap-4 shrink-0">
        <span id="today-date" class="text-brand-200">2026年8月29日 星期六</span>
      </div>
    </div>
  </div>

  <!-- ===== 头部 Logo + 搜索 + 登录 ===== -->
  <header class="bg-white border-b border-slate-100">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center gap-6 flex-wrap">
      <a href="index.html" class="flex items-center gap-3 shrink-0">
        <img src="logo.png" alt="相思门户网" title="相思门户网"
             class="h-16 w-auto object-contain shrink-0"
             onerror="this.style.display='none';document.getElementById('logo-text').style.display='block';" />
        <div id="logo-text" class="leading-tight">
          <div class="text-2xl font-bold text-accent tracking-wide">相思门户网</div>
          <div class="text-[11px] text-slate-400 tracking-widest">本地视野 · 全球资讯</div>
        </div>
      </a>

      <form id="search-form" class="flex-1 min-w-[220px] max-w-xl ml-auto">
        <div class="flex items-center bg-slate-100 rounded-full border border-slate-200 px-4 py-2 focus-within:ring-2 focus-within:ring-brand-300">
          <svg class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.3-4.3M17 10a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input id="search-input" type="text" placeholder="搜索新闻、专题、服务"
                 class="flex-1 bg-transparent outline-none text-sm px-3 placeholder:text-slate-400" />
          <button type="submit" class="text-sm font-medium text-brand-600 hover:text-brand-800 px-2">搜索</button>
        </div>
      </form>

      <div id="auth-area" class="flex items-center gap-3 shrink-0">
        <button id="login-btn" class="px-6 py-2 rounded-full text-sm font-semibold text-white bg-gradient-to-r from-accent to-orange-500 hover:opacity-90 transition shadow-sm">
          登录
        </button>
      </div>
    </div>
  </header>

  <!-- ===== 主导航 ===== -->
  <nav class="bg-brand-600 text-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 flex items-stretch">
      <ul id="main-nav" class="flex items-stretch overflow-x-auto">
        <li><a href="index.html" class="nav-link">首页</a></li>
        <li><a href="allnews.html" class="nav-link">全部</a></li>
      </ul>
    </div>
  </nav>

  <!-- ===== 用户中心主体 ===== -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
      <h1 class="text-2xl font-bold text-slate-800 border-l-4 border-brand-600 pl-3">用户中心</h1>
      <span class="text-xs text-slate-400">欢迎回来，<span id="uc-username" class="text-brand-600 font-semibold">-</span> <span id="uc-role-tag" class="role-tag"></span></span>
    </div>

    <!-- Tab 导航 -->
    <div class="flex gap-2 mb-6 bg-white rounded-xl shadow-card p-1.5 w-fit flex-wrap">
      <button type="button" class="uc-tab active" data-tab="profile">个人中心</button>
      <button type="button" id="uc-tab-creator" class="uc-tab hidden" data-tab="creator">创作者中心</button>
      <button type="button" id="uc-tab-admin" class="uc-tab hidden" data-tab="admin">管理员面板</button>
    </div>

    <!-- 模块1 · 个人综合信息（所有登录用户可见） -->
    <section id="panel-profile" class="uc-panel">
      <div class="bg-white rounded-xl shadow-card p-6 md:p-8">
        <div class="flex items-center gap-5 flex-wrap">
          <div id="profile-avatar" class="w-16 h-16 rounded-full bg-brand-600 text-white flex items-center justify-center text-2xl font-bold shrink-0">?</div>
          <div class="min-w-0">
            <div class="flex items-center gap-3 flex-wrap">
              <h2 id="profile-username" class="text-xl font-bold text-slate-800"></h2>
              <span id="profile-role-tag" class="role-tag"></span>
            </div>
            <p id="profile-created" class="mt-1.5 text-xs text-slate-400">注册时间：—</p>
          </div>
          <div id="profile-stats" class="hidden ml-auto text-center">
            <div id="profile-article-count" class="text-3xl font-bold text-brand-600">0</div>
            <div class="mt-0.5 text-xs text-slate-400">发布文章</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 模块2 · 创作者中心（creator/admin/superadmin 可见） -->
    <section id="panel-creator" class="uc-panel hidden">
    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6 items-start">
      <!-- 左栏 · 文章列表 -->
      <section class="lg:col-span-3 bg-white rounded-xl shadow-card p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold text-slate-800">文章列表</h2>
          <button id="refresh-btn" class="text-xs text-brand-500 hover:text-brand-700 transition">刷新</button>
        </div>
        <div id="article-list" class="space-y-4"></div>
      </section>

      <!-- 右栏 · 发布/编辑表单 -->
      <section class="lg:col-span-2 bg-white rounded-xl shadow-card p-6">
        <h2 id="form-title" class="text-lg font-bold text-slate-800 mb-4">发布文章</h2>
        <form id="article-form" class="space-y-4" novalidate>
          <div>
            <label for="article-title" class="block text-sm text-slate-600 mb-1.5">标题 <span class="text-red-500">*</span></label>
            <input id="article-title" type="text" placeholder="请输入文章标题"
                   class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-200 transition" />
          </div>
          <div>
            <label for="article-content" class="block text-sm text-slate-600 mb-1.5">正文 <span class="text-red-500">*</span></label>
            <textarea id="article-content" rows="8" placeholder="请输入文章正文，多个段落用空行分隔"
                      class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-200 transition resize-y"></textarea>
          </div>
          <div>
            <label for="article-topic" class="block text-sm text-slate-600 mb-1.5">专题</label>
            <select id="article-topic"
                    class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-200 transition bg-white"></select>
          </div>
          <div>
            <label for="article-image" class="block text-sm text-slate-600 mb-1.5">文章配图（图片 URL，可选）</label>
            <input id="article-image" type="url" placeholder="https://example.com/image.jpg"
                   class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-200 transition" />
          </div>
          <div>
            <label for="article-source" class="block text-sm text-slate-600 mb-1.5">来源（来源名称，可选）</label>
            <input id="article-source" type="text" placeholder="留空则显示：相思门户网"
                   class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-200 transition" />
          </div>
          <p id="form-message" class="text-xs min-h-[18px] leading-relaxed"></p>
          <div class="flex gap-3">
            <button type="submit" id="submit-btn" class="flex-1 py-2.5 rounded-lg bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700 transition">发布文章</button>
            <button type="button" id="cancel-edit-btn" class="hidden px-5 py-2.5 rounded-lg border border-slate-300 text-slate-600 text-sm font-medium hover:bg-slate-50 transition">取消编辑</button>
          </div>
        </form>
      </section>
      </div>
    </section>

    <!-- 模块3 · 管理员面板（admin/superadmin 可见） -->
    <section id="panel-admin" class="uc-panel hidden">
      <div class="bg-white rounded-xl shadow-card p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold text-slate-800">用户管理</h2>
          <button id="user-refresh-btn" class="text-xs text-brand-500 hover:text-brand-700 transition">刷新</button>
        </div>
        <div id="user-manage-list" class="overflow-x-auto"></div>
        <p id="user-manage-msg" class="mt-3 text-xs min-h-[16px] leading-relaxed"></p>
      </div>
      <div class="mt-6 bg-white rounded-xl shadow-card p-6">
        <h2 class="text-lg font-bold text-slate-800 mb-4">公告管理</h2>
        <p class="text-xs text-slate-500 mb-2">当前公告</p>
        <div id="announcement-current" class="bg-slate-50 rounded-lg px-3 py-2 text-sm text-slate-700 mb-4"></div>
        <textarea id="announcement-input" rows="2" placeholder="输入新的公告内容"
                  class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-200 transition resize-y"></textarea>
        <div class="mt-3 flex items-center gap-3 flex-wrap">
          <button id="announcement-update-btn" class="px-5 py-2 rounded-lg bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700 transition">更新公告</button>
          <p id="announcement-msg" class="text-xs min-h-[16px] leading-relaxed"></p>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== 底部 ===== -->
  <footer class="bg-brand-800 text-brand-100">
    <div class="max-w-7xl mx-auto px-4 py-8">
      <div class="flex items-center justify-center gap-x-8 gap-y-3 flex-wrap text-sm">
        <a href="topic.html?category=关于我们" class="text-brand-100 hover:text-white transition">关于我们</a>
        <span class="h-4 w-px bg-brand-600"></span>
        <a href="topic.html?category=新手入门" class="text-brand-100 hover:text-white transition">新手入门</a>
      </div>
    </div>
    <div class="bg-brand-900">
      <div class="max-w-7xl mx-auto px-4 py-5 text-center">
        <div class="text-base font-semibold text-white tracking-widest">新闻立网 · 服务生活</div>
        <p class="mt-2 text-xs text-brand-300/80">© <span id="copyright-year">2026</span> 相思门户网 · 版权所有 · 备案号：粤ICP备00000000号</p>
      </div>
    </div>
  </footer>

  <script>
    // ----- 今日日期 -----
    const dateEl = document.getElementById('today-date');
    const week = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    const now = new Date();
    if (dateEl) {
      dateEl.textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${week[now.getDay()]}`;
    }

    // ----- 版权年份自动更新 -----
    const copyrightYearEl = document.getElementById('copyright-year');
    if (copyrightYearEl) {
      copyrightYearEl.textContent = now.getFullYear();
    }

    // ----- 顶部公告（仅显示第一条，居左） -----
    const announcementContent = document.getElementById('announcement-content');
    if (announcementContent) {
      api.getAnnouncements()
        .then(list => {
          announcementContent.textContent = (list && list[0] && list[0].content) || '📢 欢迎访问相思门户网，本地视野，全球资讯。';
        })
        .catch(() => {
          announcementContent.textContent = '📢 欢迎访问相思门户网，本地视野，全球资讯。';
        });
    }

    // ----- 登录状态（所有登录用户均可访问用户中心） -----
    const authArea = document.getElementById('auth-area');
    const ucUsernameEl = document.getElementById('uc-username');
    const ucRoleTagEl = document.getElementById('uc-role-tag');
    const currentUsername = localStorage.getItem('username') || '';
    const currentRole = localStorage.getItem('role') || '';
    const currentCreatedAt = localStorage.getItem('created_at') || '';

    function roleLabel(role) {
      return { superadmin: '超级管理员', admin: '管理员', creator: '创作者', user: '普通用户' }[role] || role || '-';
    }
    function roleTagClass(role) {
      return { superadmin: 'role-superadmin', admin: 'role-admin', creator: 'role-creator', user: 'role-user' }[role] || 'role-user';
    }
    function roleTagHtml(role) {
      return `<span class="role-tag ${roleTagClass(role)}">${escapeHtml(roleLabel(role))}</span>`;
    }
    if (ucUsernameEl) ucUsernameEl.textContent = currentUsername;
    if (ucRoleTagEl) ucRoleTagEl.innerHTML = roleTagHtml(currentRole);

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function updateAuthUI() {
      if (!authArea) return;
      const username = localStorage.getItem('username') || '';
      authArea.innerHTML = `
        <span class="text-sm font-semibold text-slate-700">${escapeHtml(username)}</span>
        <button id="logout-btn" class="px-4 py-2 rounded-full text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 transition">退出</button>
      `;
      document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.removeItem('username');
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('role');
        window.location.replace('index.html');
      });
    }
    updateAuthUI();

    // ----- 搜索（模拟） -----
    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = document.getElementById('search-input').value.trim();
      if (q) alert(`正在搜索：“${q}”`);
    });

    // ----- Tab 切换 -----
    const ucTabs = document.querySelectorAll('.uc-tab');
    const ucPanels = document.querySelectorAll('.uc-panel');
    function switchTab(name) {
      ucTabs.forEach(t => t.classList.toggle('active', t.dataset.tab === name));
      ucPanels.forEach(p => p.classList.toggle('hidden', p.id !== 'panel-' + name));
    }
    ucTabs.forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

    // ----- 个人综合信息 -----
    function renderProfile() {
      const avatarEl = document.getElementById('profile-avatar');
      const usernameEl = document.getElementById('profile-username');
      const roleTagEl = document.getElementById('profile-role-tag');
      const createdEl = document.getElementById('profile-created');
      const statsEl = document.getElementById('profile-stats');
      if (avatarEl) avatarEl.textContent = (currentUsername || '?').slice(0, 1).toUpperCase();
      if (usernameEl) usernameEl.textContent = currentUsername || '-';
      if (roleTagEl) roleTagEl.innerHTML = roleTagHtml(currentRole);
      if (createdEl) createdEl.textContent = '注册时间：' + (currentCreatedAt || '未知');
      if (statsEl) statsEl.classList.toggle('hidden', currentRole === 'user');
    }

    async function loadProfileStats() {
      const countEl = document.getElementById('profile-article-count');
      if (!countEl || currentRole === 'user') return;
      try {
        const list = await api.getArticles();
        countEl.textContent = (list || []).filter(a => a.author === currentUsername).length;
      } catch (err) {
        countEl.textContent = '-';
      }
    }

    // ----- 创作者中心：文章列表与表单 -----
    const articleListEl = document.getElementById('article-list');
    const form = document.getElementById('article-form');
    const titleInput = document.getElementById('article-title');
    const contentInput = document.getElementById('article-content');
    const topicSelect = document.getElementById('article-topic');
    const imageInput = document.getElementById('article-image');
    const sourceInput = document.getElementById('article-source');
    const submitBtn = document.getElementById('submit-btn');
    const cancelEditBtn = document.getElementById('cancel-edit-btn');
    const formTitleEl = document.getElementById('form-title');
    const formMessageEl = document.getElementById('form-message');
    const refreshBtn = document.getElementById('refresh-btn');
    let editingId = null;

    function formatNow() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function showFormMessage(text, type) {
      if (!formMessageEl) return;
      formMessageEl.textContent = text;
      formMessageEl.className = 'text-xs min-h-[18px] leading-relaxed ' +
        (type === 'success' ? 'text-green-600' : (type === 'error' ? 'text-red-500' : ''));
    }

    function setFormMode(mode) {
      const isEdit = mode === 'edit';
      submitBtn.textContent = isEdit ? '更新文章' : '发布文章';
      formTitleEl.textContent = isEdit ? '编辑文章' : '发布文章';
      cancelEditBtn.classList.toggle('hidden', !isEdit);
    }

    function resetForm() {
      editingId = null;
      form.reset();
      topicSelect.value = '';
      setFormMode('create');
      showFormMessage('', '');
    }

    function fillForm(article) {
      editingId = article.id;
      titleInput.value = article.title || '';
      contentInput.value = Array.isArray(article.content) ? article.content.join('\n\n') : String(article.content || '');
      topicSelect.value = article.topic || '';
      imageInput.value = article.image || '';
      sourceInput.value = article.source || '';
      setFormMode('edit');
      showFormMessage('', '');
      form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function statusLabel(article) {
      return article.status || '已发布';
    }

    function renderArticles(list) {
      if (!articleListEl) return;
      if (!list || !list.length) {
        articleListEl.innerHTML = '<div class="py-16 text-center text-sm text-slate-400">暂无文章，开始创作吧！</div>';
        return;
      }
      const sorted = list.slice().sort((a, b) => b.id - a.id);
      articleListEl.innerHTML = sorted.map(a => {
        const canManage = currentRole === 'superadmin' || currentRole === 'admin' || a.author === currentUsername;
        return `
          <div class="border border-slate-100 rounded-xl p-4 hover:shadow-card transition">
            <div class="flex items-start justify-between gap-3 flex-wrap">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2 text-xs text-slate-400 flex-wrap">
                  <span class="px-2 py-0.5 rounded bg-blue-50 text-brand-600">${a.topic || '未分类'}</span>
                  <span>${a.time || ''}</span>
                  <span class="px-2 py-0.5 rounded bg-green-50 text-green-600">${statusLabel(a)}</span>
                </div>
                <h3 class="mt-1.5 text-sm font-bold text-slate-800 truncate">${a.title}</h3>
                <div class="mt-1 text-xs text-slate-400">作者：${escapeHtml(a.author || '未知')} | 来源：${escapeHtml(a.source || '相思门户网')}</div>
              </div>
              ${canManage ? `
                <div class="flex items-center gap-2 shrink-0">
                  <button type="button" class="edit-btn px-3 py-1.5 rounded-lg bg-brand-600 text-white text-xs font-medium hover:bg-brand-700 transition" data-id="${a.id}">编辑</button>
                  <button type="button" class="delete-btn px-3 py-1.5 rounded-lg bg-red-500 text-white text-xs font-medium hover:bg-red-600 transition" data-id="${a.id}">删除</button>
                </div>
              ` : '<span class="text-xs text-slate-300 shrink-0">仅作者可操作</span>'}
            </div>
          </div>
        `;
      }).join('');

      articleListEl.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const article = sorted.find(x => x.id === Number(btn.dataset.id));
          if (article) fillForm(article);
        });
      });
      articleListEl.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = Number(btn.dataset.id);
          if (!confirm('确定要删除这篇文章吗？删除后不可恢复。')) return;
          try {
            await api.deleteArticle(id, currentUsername);
            showFormMessage('删除成功', 'success');
            if (editingId === id) resetForm();
            await loadArticles();
          } catch (err) {
            showFormMessage(err.message || '删除失败，请稍后重试', 'error');
          }
        });
      });
    }

    async function loadArticles() {
      if (!articleListEl) return;
      articleListEl.innerHTML = '<div class="py-10 text-center text-sm text-slate-400">加载中...</div>';
      try {
        const list = await api.getArticles();
        renderArticles(list || []);
      } catch (err) {
        console.error('文章列表加载失败：', err);
        articleListEl.innerHTML = '<div class="py-10 text-center text-sm text-slate-400">文章加载失败，请稍后重试</div>';
      }
    }

    // ----- 用户管理（仅 superadmin / admin 可见） -----
    const userManageSection = document.getElementById('panel-admin');
    const userManageList = document.getElementById('user-manage-list');
    const userManageMsg = document.getElementById('user-manage-msg');
    const userRefreshBtn = document.getElementById('user-refresh-btn');

    function showUserManageMsg(text, type) {
      if (!userManageMsg) return;
      userManageMsg.textContent = text;
      userManageMsg.className = 'mt-3 text-xs min-h-[16px] leading-relaxed ' +
        (type === 'success' ? 'text-green-600' : (type === 'error' ? 'text-red-500' : ''));
    }

    async function loadUsers() {
      if (!userManageList) return;
      userManageList.innerHTML = '<div class="py-6 text-center text-sm text-slate-400">加载中...</div>';
      try {
        const users = await api.getUsers(currentUsername);
        renderUserTable(users || []);
      } catch (err) {
        userManageList.innerHTML = `<div class="py-6 text-center text-sm text-slate-400">用户列表加载失败：${escapeHtml(err.message || '请稍后重试')}</div>`;
      }
    }

    function renderUserTable(users) {
      if (!userManageList) return;
      if (!users.length) {
        userManageList.innerHTML = '<div class="py-6 text-center text-sm text-slate-400">暂无用户</div>';
        return;
      }
      userManageList.innerHTML = `
        <table class="w-full text-sm min-w-[520px]">
          <thead>
            <tr class="text-left text-slate-400 border-b border-slate-100">
              <th class="py-2 pr-3 font-medium">用户名</th>
              <th class="py-2 pr-3 font-medium">当前角色</th>
              <th class="py-2 font-medium">可执行操作</th>
            </tr>
          </thead>
          <tbody>
            ${users.map(u => `
              <tr class="border-b border-slate-50">
                <td class="py-2.5 pr-3 font-semibold text-slate-700">${escapeHtml(u.username)}</td>
                <td class="py-2.5 pr-3">${roleTagHtml(u.role)}</td>
                <td class="py-2.5">${buildUserActions(u)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      userManageList.querySelectorAll('[data-set-role]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const target = btn.dataset.target;
          const role = btn.dataset.setRole;
          if (!confirm(`确定将用户「${target}」的角色设为「${roleLabel(role)}」吗？`)) return;
          try {
            await api.setRole(currentUsername, target, role);
            showUserManageMsg(`已将「${target}」设为${roleLabel(role)}`, 'success');
            await loadUsers();
          } catch (err) {
            showUserManageMsg(err.message || '操作失败，请稍后重试', 'error');
          }
        });
      });
    }

    function buildUserActions(u) {
      // 自己的行不显示任何操作
      if (u.username === currentUsername) return '<span class="text-xs text-slate-300">自己</span>';
      // 任何人都不能修改 superadmin
      if (u.role === 'superadmin') return '<span class="text-xs text-slate-300">不可操作</span>';
      const isSuper = currentRole === 'superadmin';
      const makeBtn = (role, text, cls) =>
        `<button type="button" class="px-2.5 py-1 rounded-md text-xs font-medium mr-2 ${cls}" data-set-role="${role}" data-target="${escapeHtml(u.username)}">${text}</button>`;
      const btns = [];
      if (isSuper) {
        if (u.role === 'admin') btns.push(makeBtn('creator', '撤销管理员', 'bg-yellow-500 text-white hover:bg-yellow-600 transition'));
        if (u.role === 'creator') btns.push(makeBtn('admin', '设为管理员', 'bg-brand-600 text-white hover:bg-brand-700 transition'), makeBtn('user', '降为普通用户', 'bg-slate-500 text-white hover:bg-slate-600 transition'));
        if (u.role === 'user') btns.push(makeBtn('admin', '设为管理员', 'bg-brand-600 text-white hover:bg-brand-700 transition'), makeBtn('creator', '设为创作者', 'bg-green-600 text-white hover:bg-green-700 transition'));
      } else {
        // 普通管理员：不能设置/撤销管理员
        if (u.role === 'creator') btns.push(makeBtn('user', '降为普通用户', 'bg-slate-500 text-white hover:bg-slate-600 transition'));
        if (u.role === 'user') btns.push(makeBtn('creator', '设为创作者', 'bg-green-600 text-white hover:bg-green-700 transition'));
      }
      return btns.join('') || '<span class="text-xs text-slate-300">无可用操作</span>';
    }

    // ----- 公告管理（仅 admin / superadmin） -----
    const announcementCurrentEl = document.getElementById('announcement-current');
    const announcementInputEl = document.getElementById('announcement-input');
    const announcementUpdateBtn = document.getElementById('announcement-update-btn');
    const announcementMsgEl = document.getElementById('announcement-msg');

    async function loadAnnouncement() {
      if (!announcementCurrentEl) return;
      try {
        const list = await api.getAnnouncements();
        const text = (list && list[0] && list[0].content) || '📢 欢迎访问相思门户网，本地视野，全球资讯。';
        announcementCurrentEl.textContent = text;
        if (announcementInputEl) announcementInputEl.value = text;
      } catch (err) {
        announcementCurrentEl.textContent = '公告加载失败，请稍后重试';
      }
    }

    if (announcementUpdateBtn) {
      announcementUpdateBtn.addEventListener('click', async () => {
        const content = announcementInputEl ? announcementInputEl.value.trim() : '';
        if (!content) {
          if (announcementMsgEl) {
            announcementMsgEl.textContent = '公告内容不能为空';
            announcementMsgEl.className = 'text-xs text-red-500';
          }
          return;
        }
        try {
          await api.updateAnnouncement(content, currentUsername);
          if (announcementMsgEl) {
            announcementMsgEl.textContent = '公告已更新';
            announcementMsgEl.className = 'text-xs text-green-600';
          }
          await loadAnnouncement();
        } catch (err) {
          if (announcementMsgEl) {
            announcementMsgEl.textContent = err.message || '更新失败，请稍后重试';
            announcementMsgEl.className = 'text-xs text-red-500';
          }
        }
      });
    }

    if (userRefreshBtn) userRefreshBtn.addEventListener('click', loadUsers);

    // 专题下拉（来自 data.js hotKeywords）；"无" 表示不属于任何专题
    const noneOption = document.createElement('option');
    noneOption.value = '';
    noneOption.textContent = '无';
    topicSelect.appendChild(noneOption);
    hotKeywords.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      topicSelect.appendChild(opt);
    });
    // 管理员专属专题：关于我们 / 新手入门（仅 admin/superadmin 可选）
    if (currentRole === 'superadmin' || currentRole === 'admin') {
      ['关于我们', '新手入门'].forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        topicSelect.appendChild(opt);
      });
    }
    topicSelect.value = '';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();
      const topic = topicSelect.value;
      const image = imageInput.value.trim();
      const source = sourceInput.value.trim();
      if (!title) { showFormMessage('标题不能为空', 'error'); return; }
      if (!content) { showFormMessage('正文不能为空', 'error'); return; }
      const contentParagraphs = content.split(/\n+/).map(s => s.trim()).filter(Boolean);

      submitBtn.disabled = true;
      submitBtn.textContent = editingId !== null ? '更新中...' : '发布中...';
      try {
        if (editingId !== null) {
          await api.updateArticle(editingId, { title, content: contentParagraphs, topic, image, source, username: currentUsername });
          showFormMessage('文章更新成功', 'success');
        } else {
          await api.createArticle(title, contentParagraphs, topic, formatNow(), image, source, currentUsername);
          showFormMessage('文章发布成功', 'success');
        }
        resetForm();
        await loadArticles();
      } catch (err) {
        showFormMessage(err.message || '操作失败，请稍后重试', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = editingId !== null ? '更新文章' : '发布文章';
      }
    });

    cancelEditBtn.addEventListener('click', resetForm);
    refreshBtn.addEventListener('click', loadArticles);

    // ----- 初始化：按角色显示模块 -----
    const canCreate = currentRole === 'superadmin' || currentRole === 'admin' || currentRole === 'creator';
    const canAdmin = currentRole === 'superadmin' || currentRole === 'admin';
    const tabCreatorEl = document.getElementById('uc-tab-creator');
    const tabAdminEl = document.getElementById('uc-tab-admin');
    if (canCreate && tabCreatorEl) tabCreatorEl.classList.remove('hidden');
    if (canAdmin && tabAdminEl) tabAdminEl.classList.remove('hidden');

    renderProfile();
    loadProfileStats();
    if (canCreate) loadArticles();
    if (canAdmin) {
      loadUsers();
      loadAnnouncement();
    }
  </script>

  <style>
    .nav-link {
      display: flex;
      align-items: center;
      height: 52px;
      padding: 0 1.25rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: rgba(255,255,255,.85);
      transition: background .2s, color .2s;
      white-space: nowrap;
    }
    .nav-link:hover { background: rgba(255,255,255,.12); color: #fff; }

    /* 用户中心 Tab */
    .uc-tab {
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      transition: background .2s, color .2s;
    }
    .uc-tab:hover { background: #f1f5f9; }
    .uc-tab.active { background: #1e3a8a; color: #fff; }

    /* 角色标签 */
    .role-tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      line-height: 20px;
    }
    .role-superadmin { background: #fee2e2; color: #b91c1c; }
    .role-admin { background: #dbeafe; color: #1d4ed8; }
    .role-creator { background: #dcfce7; color: #15803d; }
    .role-user { background: #f1f5f9; color: #64748b; }
  </style>
</body>
</html>
