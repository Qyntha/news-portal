<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>相思门户网 · 新闻立网 服务生活</title>
  <meta name="description" content="相思门户网——本地视野，全球资讯。覆盖本地、国际、财经、科技、文化、体育六大频道，便民服务一站直达。" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#eef2fb',
              100: '#dbe3f5',
              200: '#b6c4e8',
              300: '#8aa0d6',
              400: '#5a77c0',
              500: '#35539f',
              DEFAULT: '#1e3a8a',
              600: '#1e3a8a',
              700: '#173071',
              800: '#122658',
              900: '#0d1c42'
            },
            accent: {
              DEFAULT: '#f59e0b',
              light: '#fbbf24'
            }
          },
          fontFamily: {
            sans: ['"PingFang SC"', '"Microsoft YaHei"', '"Hiragino Sans GB"', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            card: '0 1px 3px rgba(13,28,66,.06), 0 8px 24px rgba(13,28,66,.06)'
          }
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body { -webkit-font-smoothing: antialiased; }

    /* 新闻项时间轴圆点 */
    .news-dot {
      position: relative;
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: #1e3a8a;
      flex-shrink: 0;
    }
    .news-dot::after {
      content: "";
      position: absolute;
      left: 3px;
      bottom: -14px;
      width: 1px;
      height: 14px;
      background: #cbd5e1;
    }
    .news-item:last-child .news-dot::after { display: none; }

    /* 主图渐隐遮罩 */
    .hero-mask {
      background: linear-gradient(180deg, rgba(13,28,66,0) 0%, rgba(13,28,66,.55) 55%, rgba(13,28,66,.85) 100%);
    }

    /* 顶部导航栏下方悬浮热词条 */
    .hotbar {
      position: sticky;
      top: 0;
      z-index: 30;
    }
  </style>
  <script src="data.js"></script>
  <script src="api.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

  <!-- ===== 顶部服务条（公告） ===== -->
  <div class="bg-brand-900 text-brand-100 text-xs">
    <div class="max-w-7xl mx-auto px-4 h-9 flex items-center justify-between gap-4">
      <div class="flex-1 min-w-0 flex items-center">
        <div id="announcement-bar" class="flex-1 min-w-0 flex items-center">
          <span id="announcement-text" class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-accent shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            <span id="announcement-content" class="truncate"></span>
          </span>
        </div>
      </div>
      <div class="flex items-center gap-4 shrink-0">
        <span id="today-date" class="text-brand-200">2026年8月29日 星期六</span>
      </div>
    </div>
  </div>

  <!-- ===== 头部 Logo + 搜索 + 登录 ===== -->
  <header class="bg-white border-b border-slate-100">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center gap-6 flex-wrap">
      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-3 shrink-0">
        <img src="logo.png" alt="相思门户网" title="相思门户网"
             class="h-16 w-auto object-contain shrink-0"
             onerror="this.style.display='none';document.getElementById('logo-text').style.display='block';" />
        <div id="logo-text" class="leading-tight">
          <div class="text-2xl font-bold text-accent tracking-wide">相思门户网</div>
          <div class="text-[11px] text-slate-400 tracking-widest">本地视野 · 全球资讯</div>
        </div>
      </a>

      <!-- 搜索 -->
      <form id="search-form" action="https://www.baidu.com/s" method="get" target="_blank" class="flex-1 min-w-[220px] max-w-xl ml-auto">
        <div class="flex items-center bg-slate-100 rounded-full border border-slate-200 px-4 py-2 focus-within:ring-2 focus-within:ring-brand-300">
          <svg class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.3-4.3M17 10a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input id="search-input" name="wd" type="text" placeholder="搜索新闻、专题、服务"
                 class="flex-1 bg-transparent outline-none text-sm px-3 placeholder:text-slate-400" />
          <button type="submit" class="text-sm font-medium text-brand-600 hover:text-brand-800 px-2">搜索</button>
        </div>
        <input type="hidden" name="site" value="qyntha.github.io" />
      </form>

      <!-- 登录 / 注册入口 -->
      <div id="auth-area" class="flex items-center gap-3 shrink-0">
        <button id="login-btn" class="px-6 py-2 rounded-full text-sm font-semibold text-white bg-gradient-to-r from-accent to-orange-500 hover:opacity-90 transition shadow-sm">
          登录
        </button>
      </div>
    </div>
  </header>

  <!-- ===== 主导航 ===== -->
  <nav class="bg-brand-600 text-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 flex items-stretch">
      <ul id="main-nav" class="flex items-stretch overflow-x-auto">
        <li><a href="index.html" class="nav-link active">首页</a></li>
        <li><a href="https://www.gov.cn/" target="_blank" class="nav-link">中国政府网</a></li>
        <li><a href="http://www.moe.gov.cn/" target="_blank" class="nav-link">教育部</a></li>
        <li><a href="http://www.shandong.gov.cn/" target="_blank" class="nav-link">山东省政府</a></li>
        <li><a href="http://edu.shandong.gov.cn/" target="_blank" class="nav-link">山东省教育厅</a></li>
        <li><a href="./allnews.html" class="nav-link">全部</a></li>
      </ul>
      <div class="ml-auto flex items-center gap-3">
        <button id="register-btn" class="px-5 py-2 rounded-full text-sm font-semibold bg-white text-brand-600 hover:bg-brand-50 transition">
          注册
        </button>
      </div>
    </div>
  </nav>

  <!-- ===== 热词条 / 快捷搜索 ===== -->
  <div class="hotbar bg-white border-b border-slate-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4 flex-wrap">
      <a href="topic.html" class="px-3 py-1 rounded-full bg-brand-600 text-white text-xs font-semibold hover:opacity-90 transition cursor-pointer">热门</a>
      <div id="hot-keywords" class="flex items-center gap-4 flex-wrap"></div>
      <span class="mx-2 h-4 w-px bg-slate-200 hidden md:inline-block"></span>
      <a href="topic.html" class="text-sm text-slate-600 hover:text-brand-600 transition">更多专题 ›</a>
    </div>
  </div>

  <!-- ===== 头条焦点 · 三张头条卡 ===== -->
  <section class="max-w-7xl mx-auto px-4 pt-6">
    <div id="top-cards" class="grid grid-cols-1 md:grid-cols-3 gap-5"></div>
  </section>

  <!-- ===== 头条封面 + 最新要闻 ===== -->
  <section class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- 左 · 封面头条 -->
      <div class="lg:col-span-2">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-bold text-slate-800 border-l-4 border-brand-600 pl-3">今日头条</h2>
        </div>

        <!-- 轮播图 -->
        <div id="carousel-wrap" class="relative rounded-xl overflow-hidden shadow-card">
          <div id="carousel-viewport" class="relative h-[420px] overflow-hidden bg-slate-100">
            <div class="absolute inset-0 flex items-center justify-center text-sm text-slate-400">加载中...</div>
          </div>
          <button id="carousel-prev" type="button" aria-label="上一张" class="carousel-arrow left-3">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
          </button>
          <button id="carousel-next" type="button" aria-label="下一张" class="carousel-arrow right-3">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
          </button>
          <div id="carousel-dots" class="hidden absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2 z-10"></div>
        </div>
      </div>

      <!-- 右 · 最新要闻 -->
      <aside class="bg-white rounded-xl shadow-card p-5 flex flex-col">
        <div class="flex items-center justify-between mb-1">
          <h2 class="text-lg font-bold text-slate-800">最新要闻</h2>
          <span class="px-2 py-0.5 rounded bg-brand-600 text-white text-xs">快讯</span>
        </div>
        <ul id="latest-news" class="divide-y divide-slate-100 text-sm"></ul>
        <a href="allnews.html" class="mt-auto pt-4 block text-xs text-brand-500 hover:text-brand-700 transition text-center">查看更多要闻 ›</a>
      </aside>
    </div>
  </section>

  <!-- ===== 频道精选 ===== -->
  <section class="max-w-7xl mx-auto px-4 pb-8">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-bold text-slate-800 border-l-4 border-brand-600 pl-3">频道精选</h2>
    </div>

    <div id="channel-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5"></div>
  </section>

  <!-- ===== 便民服务 + 学习资料 ===== -->
  <section class="max-w-7xl mx-auto px-4 pb-10">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- 便民服务 -->
      <div class="lg:col-span-2 bg-white rounded-xl shadow-card p-6">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-bold text-slate-800 border-l-4 border-brand-600 pl-3">便民服务</h2>
        </div>

        <div id="services-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-4"></div>
      </div>

      <!-- 学习资料 -->
      <aside class="bg-white rounded-xl shadow-card p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-bold text-slate-800 border-l-4 border-brand-600 pl-3">学习资料</h2>
          <span class="text-xs text-slate-400">综合</span>
        </div>
        <ul id="topics" class="space-y-1 text-sm"></ul>
      </aside>
    </div>
  </section>

  <!-- ===== 底部 ===== -->
  <footer class="bg-brand-800 text-brand-100">
    <div class="max-w-7xl mx-auto px-4 py-8">
      <div class="flex items-center justify-center gap-x-8 gap-y-3 flex-wrap text-sm">
        <a href="topic.html?category=关于我们" class="text-brand-100 hover:text-white transition">关于我们</a>
        <span class="h-4 w-px bg-brand-600"></span>
        <a href="topic.html?category=新手入门" class="text-brand-100 hover:text-white transition">新手入门</a>
      </div>
    </div>
    <div class="bg-brand-900">
      <div class="max-w-7xl mx-auto px-4 py-5 text-center">
        <div class="text-base font-semibold text-white tracking-widest">新闻立网 · 服务生活</div>
        <p class="mt-2 text-xs text-brand-300/80">© <span id="copyright-year">2026</span> 相思门户网 · 版权所有 · 备案号：粤ICP备00000000号</p>
      </div>
    </div>
  </footer>

  <!-- ===== 右侧悬浮按钮 ===== -->
  <div class="fixed right-4 bottom-6 flex flex-col gap-3 z-40">
    <button id="back-to-top" title="返回顶部"
            class="w-12 h-12 rounded-full bg-brand-600 text-white shadow-lg hover:bg-brand-700 transition items-center justify-center hidden">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
    </button>
    <button data-share title="分享" class="w-12 h-12 rounded-full bg-brand-600 text-white shadow-lg hover:bg-brand-700 transition flex items-center justify-center">
      <span class="text-[11px] font-semibold">分享</span>
    </button>
  </div>

  <!-- ===== 登录 / 注册弹窗 ===== -->
  <div id="auth-modal" class="fixed inset-0 z-50 hidden items-center justify-center">
    <div class="absolute inset-0 bg-black/50" data-close-modal></div>
    <div class="relative w-full max-w-[420px] mx-4 bg-white rounded-2xl shadow-2xl p-8">
      <button id="auth-close" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition" aria-label="关闭">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>

      <h3 class="text-xl font-bold text-slate-800 mb-5">用户中心</h3>
      <div class="flex gap-2 p-1 bg-slate-100 rounded-full mb-6">
        <button id="tab-login" class="auth-tab active-tab flex-1 py-2 rounded-full text-sm font-semibold">登录</button>
        <button id="tab-register" class="auth-tab flex-1 py-2 rounded-full text-sm font-semibold">注册</button>
      </div>

      <form id="login-form" class="space-y-4" novalidate>
        <div>
          <label for="login-username" class="block text-sm text-slate-600 mb-1.5">用户名</label>
          <input id="login-username" type="text" autocomplete="username" placeholder="请输入用户名（不少于 3 个字符）"
                 class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-200 transition" />
        </div>
        <div>
          <label for="login-password" class="block text-sm text-slate-600 mb-1.5">密码</label>
          <input id="login-password" type="password" autocomplete="current-password" placeholder="请输入密码（不少于 6 个字符）"
                 class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-200 transition" />
        </div>
        <p id="login-error" class="text-xs text-red-500 min-h-[18px] leading-relaxed"></p>
        <button type="submit" class="w-full py-2.5 rounded-lg bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700 transition">登 录</button>
      </form>

      <form id="register-form" class="space-y-4 hidden" novalidate>
        <div>
          <label for="register-username" class="block text-sm text-slate-600 mb-1.5">用户名</label>
          <input id="register-username" type="text" autocomplete="username" placeholder="请输入用户名（不少于 3 个字符）"
                 class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-200 transition" />
        </div>
        <div>
          <label for="register-password" class="block text-sm text-slate-600 mb-1.5">密码</label>
          <input id="register-password" type="password" autocomplete="new-password" placeholder="请输入密码（不少于 6 个字符）"
                 class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-200 transition" />
        </div>
        <div>
          <label for="register-confirm" class="block text-sm text-slate-600 mb-1.5">确认密码</label>
          <input id="register-confirm" type="password" autocomplete="new-password" placeholder="请再次输入密码"
                 class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-200 transition" />
        </div>
        <div>
          <label for="register-role" class="block text-sm text-slate-600 mb-1.5">注册身份</label>
          <select id="register-role"
                  class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-200 transition bg-white">
            <option value="user">普通用户（只读）</option>
            <option value="creator">创作者（可发布文章）</option>
          </select>
        </div>
        <p id="register-error" class="text-xs text-red-500 min-h-[18px] leading-relaxed"></p>
        <button type="submit" class="w-full py-2.5 rounded-lg bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700 transition">注 册</button>
      </form>
    </div>
  </div>

  <script>
    // ----- 今日日期 -----
    const dateEl = document.getElementById('today-date');
    const week = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    const now = new Date();
    if (dateEl) {
      dateEl.textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${week[now.getDay()]}`;
    }

    // ----- 版权年份自动更新 -----
    const copyrightYearEl = document.getElementById('copyright-year');
    if (copyrightYearEl) {
      copyrightYearEl.textContent = now.getFullYear();
    }

    // ----- 顶部公告（仅显示第一条，居左） -----
    const announcementContent = document.getElementById('announcement-content');
    if (announcementContent) {
      api.getAnnouncements()
        .then(list => {
          const items = (list || []).map(a => a.content).filter(Boolean);
          if (!items.length) items.push('📢 欢迎访问相思门户网，本地视野，全球资讯。');
          let idx = 0;
          announcementContent.textContent = items[0];
          if (items.length > 1) {
            setInterval(() => {
              idx = (idx + 1) % items.length;
              announcementContent.textContent = items[idx];
            }, 6000);
          }
        })
        .catch(() => {
          announcementContent.textContent = '📢 欢迎访问相思门户网，本地视野，全球资讯。';
        });
    }

    // ----- 导航链接样式 -----
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', (e) => {
        const href = link.getAttribute('href');
        // 如果是 .html 页面链接或外部链接，允许正常跳转
        if (href && (href.endsWith('.html') || href.startsWith('http'))) {
          return;
        }
        e.preventDefault();
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
        const targetId = link.dataset.target;
        if (targetId) {
          const el = document.getElementById(targetId);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      });
    });

    // ----- 热门搜索词渲染 -----
    const hotKeywordsWrap = document.getElementById('hot-keywords');
    if (hotKeywordsWrap) {
      hotKeywordsWrap.innerHTML = hotKeywords.map(k => `
        <a href="topic.html?category=${encodeURIComponent(k)}" class="text-sm text-slate-600 hover:text-brand-600 transition">${k}</a>
      `).join('');
    }

    // ----- 头条焦点 · 三张头条卡渲染（后端 API） -----
    const topCardsWrap = document.getElementById('top-cards');
    function excerpt(content, len) {
      const text = Array.isArray(content) ? content.join('') : String(content || '');
      return text.replace(/\s+/g, '').slice(0, len);
    }
    function cardImage(article, w, h) {
      return article.image || `https://picsum.photos/seed/${article.id}/${w}/${h}`;
    }
    function renderTopCards(list) {
      if (!topCardsWrap) return;
      if (!list || !list.length) {
        topCardsWrap.innerHTML = '<div class="col-span-full py-10 text-center text-sm text-slate-400">暂无文章</div>';
        return;
      }
      topCardsWrap.innerHTML = list.slice(0, 3).map((card, i) => `
        <a href="article.html?id=${card.id}" class="group block bg-white rounded-xl overflow-hidden shadow-card hover:shadow-lg transition cursor-pointer">
          <div class="relative h-48 overflow-hidden">
            <img src="${cardImage(card, 640, 420)}" alt="${card.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy" />
            <span class="absolute top-3 right-3 w-6 h-6 rounded-full bg-red-500 text-white text-xs font-bold items-center justify-center flex">${i + 1}</span>
          </div>
          <div class="p-5">
            <h3 class="text-base font-bold text-slate-800 group-hover:text-brand-600 transition">${card.title}</h3>
            <p class="mt-1 text-xs text-slate-400">${excerpt(card.content, 20)}</p>
            <div class="mt-3 flex items-center justify-between">
              <span class="px-2 py-0.5 rounded bg-blue-50 text-brand-600 text-xs">${card.topic || '新闻'}</span>
              <span class="text-xs text-brand-500 group-hover:text-brand-700 transition">阅读全文 →</span>
            </div>
          </div>
        </a>
      `).join('');
    }

    // ----- 今日头条：轮播图 -----
    const carouselViewport = document.getElementById('carousel-viewport');
    const carouselPrev = document.getElementById('carousel-prev');
    const carouselNext = document.getElementById('carousel-next');
    const carouselDots = document.getElementById('carousel-dots');
    let carouselList = [];
    let carouselIndex = 0;
    let carouselTimer = null;

    function showCarouselSlide(index) {
      const slides = carouselViewport ? carouselViewport.querySelectorAll('.carousel-slide') : [];
      if (!slides.length) return;
      carouselIndex = (index + slides.length) % slides.length;
      slides.forEach((s, i) => s.classList.toggle('active', i === carouselIndex));
      const dots = carouselDots ? carouselDots.querySelectorAll('.carousel-dot') : [];
      dots.forEach((d, i) => d.classList.toggle('active', i === carouselIndex));
    }

    function renderCarouselSlides() {
      if (!carouselViewport) return;
      if (!carouselList.length) {
        carouselViewport.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-sm text-slate-400">暂无轮播文章</div>';
        return;
      }
      carouselViewport.innerHTML = carouselList.map((a, i) => `
        <a href="article.html?id=${a.id}" class="carousel-slide ${i === 0 ? 'active' : ''} absolute inset-0 group block">
          <img src="${cardImage(a, 1280, 720)}" alt="${a.title}" class="w-full h-full object-cover" loading="${i === 0 ? 'eager' : 'lazy'}" />
          <span class="absolute top-5 right-5 px-3 py-1 bg-yellow-400 text-brand-900 text-xs font-bold rounded-sm shadow">${a.topic || '头条'}</span>
          <div class="absolute inset-0 hero-mask"></div>
          <div class="absolute bottom-0 left-0 right-0 p-6">
            <h3 class="text-2xl md:text-3xl font-bold text-white leading-snug group-hover:text-accent-light transition">${a.title}</h3>
            <p class="mt-2 text-sm text-white/85">${excerpt(a.content, 30) || '点击阅读全文'}</p>
          </div>
        </a>
      `).join('');
      if (carouselDots) {
        carouselDots.innerHTML = carouselList.map((a, i) => `
          <button type="button" class="carousel-dot ${i === carouselIndex ? 'active' : ''}" data-index="${i}" aria-label="第 ${i + 1} 张"></button>
        `).join('');
        carouselDots.querySelectorAll('.carousel-dot').forEach(dot => {
          dot.addEventListener('click', () => {
            showCarouselSlide(Number(dot.dataset.index));
            restartCarouselTimer();
          });
        });
      }
    }

    function restartCarouselTimer() {
      if (carouselTimer) clearInterval(carouselTimer);
      carouselTimer = null;
      if (carouselList.length > 1) {
        carouselTimer = setInterval(() => showCarouselSlide(carouselIndex + 1), 5000);
      }
    }

    if (carouselPrev) carouselPrev.addEventListener('click', () => { showCarouselSlide(carouselIndex - 1); restartCarouselTimer(); });
    if (carouselNext) carouselNext.addEventListener('click', () => { showCarouselSlide(carouselIndex + 1); restartCarouselTimer(); });

    api.getCarousel()
      .then(list => {
        carouselList = list || [];
        renderCarouselSlides();
        showCarouselSlide(0);
        const many = carouselList.length > 1;
        if (carouselPrev) carouselPrev.classList.toggle('show', many);
        if (carouselNext) carouselNext.classList.toggle('show', many);
        if (carouselDots) carouselDots.classList.toggle('hidden', !many);
        restartCarouselTimer();
      })
      .catch(err => {
        console.error('轮播加载失败：', err);
        if (carouselViewport) carouselViewport.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-sm text-slate-400">轮播加载失败</div>';
      });

    // ----- 最新要闻渲染（后端 API） -----
    const latestNewsList = document.getElementById('latest-news');
    function renderLatestNews(list) {
      if (!latestNewsList) return;
      if (!list || !list.length) {
        latestNewsList.innerHTML = '<li class="py-3 text-sm text-slate-400">暂无文章</li>';
        return;
      }
      latestNewsList.innerHTML = list.slice(0, 7).map(n => `
        <li class="news-item flex items-start gap-3 py-3">
          <span class="news-dot mt-1.5"></span>
          <a href="article.html?id=${n.id}" class="flex-1 text-slate-700 hover:text-brand-600 transition leading-snug">${n.title}</a>
          <span class="text-xs text-slate-400 shrink-0 mt-0.5">${n.time || ''}</span>
        </li>
      `).join('');
    }

    // ----- 频道精选：按指定专题顺序取每专题最新文章 -----
    const channelCardsWrap = document.getElementById('channel-cards');
    const topicOrder = ['时政要闻', '校园点对点', '评论', '关于我们'];
    function renderChannelCards(sortedList) {
      if (!channelCardsWrap) return;
      const source = sortedList || [];
      channelCardsWrap.innerHTML = topicOrder.map(topic => {
        const article = source.find(a => a.topic === topic);
        if (!article) {
          return `
            <div class="flex flex-col items-center justify-center bg-slate-100 rounded-xl shadow-card px-5 py-10 text-center">
              <span class="inline-block px-2.5 py-1 rounded bg-slate-200 text-slate-500 text-xs font-semibold">${topic}</span>
              <p class="mt-3 text-sm text-slate-400">暂无内容</p>
            </div>
          `;
        }
        return `
          <a href="article.html?id=${article.id}" class="group block bg-white rounded-xl overflow-hidden shadow-card hover:shadow-lg transition">
            <div class="relative h-36 overflow-hidden">
              <img src="${cardImage(article, 520, 300)}" alt="${article.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy" />
            </div>
            <div class="p-5">
              <span class="inline-block px-2.5 py-1 rounded bg-blue-50 text-brand-600 text-xs font-semibold">${article.topic}</span>
              <h3 class="mt-2 text-base font-bold text-slate-800 group-hover:text-brand-600 transition">${article.title}</h3>
              <p class="mt-1 text-xs text-slate-400">${excerpt(article.content, 30)}</p>
            </div>
          </a>
        `;
      }).join('');
    }

    // ----- 页面加载：从后端 API 获取文章数据 -----
    if (topCardsWrap) topCardsWrap.innerHTML = '<div class="col-span-full py-10 text-center text-sm text-slate-400">加载中...</div>';
    if (latestNewsList) latestNewsList.innerHTML = '<li class="py-3 text-sm text-slate-400">加载中...</li>';
    if (channelCardsWrap) channelCardsWrap.innerHTML = '<div class="col-span-full py-10 text-center text-sm text-slate-400">加载中...</div>';

    api.getArticles()
      .then(list => {
        const sorted = (list || []).slice().sort((a, b) => b.id - a.id);
        // 关于我们/新手入门专题的文章不进头条/最新要闻
        const visible = sorted.filter(a => !['关于我们', '新手入门'].includes(a.topic));
        renderLatestNews(visible);
        renderTopCards(visible);
        renderChannelCards(sorted);
      })
      .catch(err => {
        console.error('文章列表加载失败：', err);
        if (topCardsWrap) topCardsWrap.innerHTML = '<div class="col-span-full py-10 text-center text-sm text-slate-400">头条加载失败，请稍后重试</div>';
        if (latestNewsList) latestNewsList.innerHTML = '<li class="py-3 text-sm text-slate-400">要闻加载失败，请稍后重试</li>';
        if (channelCardsWrap) channelCardsWrap.innerHTML = '<div class="col-span-full py-10 text-center text-sm text-slate-400">频道精选加载失败，请稍后重试</div>';
      });

    // ----- 便民服务渲染 -----
    const servicesGrid = document.getElementById('services-grid');
    if (servicesGrid) {
      servicesGrid.innerHTML = services.map(s => `
        <a href="${s.link}" target="_blank" rel="noopener noreferrer" class="group flex flex-col items-center gap-3 py-4 rounded-xl hover:bg-brand-50 transition">
          <span class="w-12 h-12 rounded-xl bg-brand-50 group-hover:bg-brand-100 text-brand-600 flex items-center justify-center">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="${s.icon}"/>
            </svg>
          </span>
          <span class="text-sm text-slate-600 group-hover:text-brand-600 transition">${s.name}</span>
        </a>
      `).join('');
    }

    // ----- 学习资料渲染 -----
    const topicsList = document.getElementById('topics');
    if (topicsList) {
      topicsList.innerHTML = topics.map(t => `
        <li>
          <div class="flex items-center gap-3 py-3 px-2 rounded-lg hover:bg-slate-50 transition">
            <svg class="w-5 h-5 text-brand-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${t.icon}"/></svg>
            <span class="flex-1 text-slate-700 hover:text-brand-600 transition">${t.name}</span>
            <svg class="w-4 h-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
          </div>
        </li>
      `).join('');
    }

    // ----- 返回顶部 -----
    const backBtn = document.getElementById('back-to-top');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 400) {
        backBtn.classList.remove('hidden');
        backBtn.classList.add('flex');
      } else {
        backBtn.classList.add('hidden');
        backBtn.classList.remove('flex');
      }
    });
    backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // ----- 登录 / 注册弹窗与状态管理 -----
    const authModal = document.getElementById('auth-modal');
    const authArea = document.getElementById('auth-area');
    const registerNavBtn = document.getElementById('register-btn');
    const authClose = document.getElementById('auth-close');
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const loginErrorEl = document.getElementById('login-error');
    const registerErrorEl = document.getElementById('register-error');

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function switchAuthTab(tab) {
      const isLogin = tab === 'login';
      tabLogin.classList.toggle('active-tab', isLogin);
      tabRegister.classList.toggle('active-tab', !isLogin);
      loginForm.classList.toggle('hidden', !isLogin);
      registerForm.classList.toggle('hidden', isLogin);
      loginErrorEl.textContent = '';
      registerErrorEl.textContent = '';
    }

    function openAuthModal(tab) {
      if (!authModal) return;
      switchAuthTab(tab === 'register' ? 'register' : 'login');
      authModal.classList.remove('hidden');
      authModal.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }

    function closeAuthModal() {
      if (!authModal) return;
      authModal.classList.add('hidden');
      authModal.classList.remove('flex');
      document.body.style.overflow = '';
    }

    function updateAuthUI() {
      if (!authArea) return;
      const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
      const username = localStorage.getItem('username') || '';
      if (isLoggedIn) {
        authArea.innerHTML = `
          <a href="admin.html" class="px-4 py-2 rounded-full text-sm font-semibold text-brand-600 border border-brand-600 hover:bg-brand-50 transition">用户中心</a>
          <span class="text-sm font-semibold text-slate-700">${escapeHtml(username)}</span>
          <button id="logout-btn" class="px-4 py-2 rounded-full text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 transition">退出</button>
        `;
        document.getElementById('logout-btn').addEventListener('click', logout);
      } else {
        authArea.innerHTML = `
          <button id="login-btn" class="px-6 py-2 rounded-full text-sm font-semibold text-white bg-gradient-to-r from-accent to-orange-500 hover:opacity-90 transition shadow-sm">登录</button>
        `;
        document.getElementById('login-btn').addEventListener('click', () => openAuthModal('login'));
      }
    }

    function logout() {
      localStorage.removeItem('username');
      localStorage.removeItem('isLoggedIn');
      localStorage.removeItem('role');
      localStorage.removeItem('created_at');
      updateAuthUI();
    }

    tabLogin.addEventListener('click', () => switchAuthTab('login'));
    tabRegister.addEventListener('click', () => switchAuthTab('register'));
    authClose.addEventListener('click', closeAuthModal);
    document.querySelectorAll('[data-close-modal]').forEach(el => el.addEventListener('click', closeAuthModal));
    if (registerNavBtn) registerNavBtn.addEventListener('click', () => openAuthModal('register'));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAuthModal(); });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginErrorEl.textContent = '';
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      if (username.length < 3) { loginErrorEl.textContent = '用户名不少于 3 个字符'; return; }
      if (password.length < 6) { loginErrorEl.textContent = '密码不少于 6 个字符'; return; }
      try {
        const data = await api.login(username, password);
        if (data && data.success) {
          localStorage.setItem('username', data.username || username);
          localStorage.setItem('isLoggedIn', 'true');
          localStorage.setItem('role', data.role || 'user');
          localStorage.setItem('created_at', data.created_at || '');
          loginForm.reset();
          updateAuthUI();
          closeAuthModal();
        } else {
          loginErrorEl.textContent = (data && data.message) || '登录失败，请稍后重试';
        }
      } catch (err) {
        loginErrorEl.textContent = err.message || '登录失败，请稍后重试';
      }
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      registerErrorEl.textContent = '';
      const username = document.getElementById('register-username').value.trim();
      const password = document.getElementById('register-password').value;
      const confirmPassword = document.getElementById('register-confirm').value;
      const role = document.getElementById('register-role').value;
      if (username.length < 3) { registerErrorEl.textContent = '用户名不少于 3 个字符'; return; }
      if (password.length < 6) { registerErrorEl.textContent = '密码不少于 6 个字符'; return; }
      if (password !== confirmPassword) { registerErrorEl.textContent = '两次输入的密码不一致'; return; }
      try {
        const data = await api.register(username, password, role);
        if (data && data.success) {
          // 注册成功后自动登录
          const loginData = await api.login(username, password);
          if (loginData && loginData.success) {
            localStorage.setItem('username', loginData.username || username);
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('role', loginData.role || 'user');
            localStorage.setItem('created_at', loginData.created_at || '');
            registerForm.reset();
            updateAuthUI();
            closeAuthModal();
          } else {
            switchAuthTab('login');
            document.getElementById('login-username').value = username;
            loginErrorEl.textContent = (loginData && loginData.message) || '注册成功，请手动登录';
          }
        } else {
          registerErrorEl.textContent = (data && data.message) || '注册失败，请稍后重试';
        }
      } catch (err) {
        registerErrorEl.textContent = err.message || '注册失败，请稍后重试';
      }
    });

    // 页面加载时恢复登录状态
    updateAuthUI();
  </script>

  <style>
    .nav-link {
      display: flex;
      align-items: center;
      height: 52px;
      padding: 0 1.25rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: rgba(255,255,255,.85);
      transition: background .2s, color .2s;
      white-space: nowrap;
    }
    .nav-link:hover { background: rgba(255,255,255,.12); color: #fff; }
    .nav-link.active { background: #fff; color: #1e3a8a; font-weight: 700; }

    /* 登录/注册 Tab */
    .auth-tab {
      color: #64748b;
      transition: background .2s, color .2s;
    }
    .auth-tab.active-tab {
      background: #1e3a8a;
      color: #fff;
    }

    /* 轮播图 */
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      background: rgba(0,0,0,.35);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      transition: background .2s;
    }
    .carousel-arrow:hover { background: rgba(0,0,0,.55); }
    .carousel-arrow.show { display: flex; }
    .carousel-slide { opacity: 0; pointer-events: none; transition: opacity .6s ease; }
    .carousel-slide.active { opacity: 1; pointer-events: auto; }
    .carousel-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: rgba(255,255,255,.45);
      transition: background .2s, transform .2s;
    }
    .carousel-dot.active { background: #fff; transform: scale(1.25); }
  </style>
  <script src="share.js"></script>
</body>
</html>
