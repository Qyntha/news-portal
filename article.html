<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章详情 - 相思门户网</title>
  <meta name="description" content="相思门户网——本地视野，全球资讯。阅读新闻全文，了解最新动态。" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#eef2fb',
              100: '#dbe3f5',
              200: '#b6c4e8',
              300: '#8aa0d6',
              400: '#5a77c0',
              500: '#35539f',
              DEFAULT: '#1e3a8a',
              600: '#1e3a8a',
              700: '#173071',
              800: '#122658',
              900: '#0d1c42'
            },
            accent: {
              DEFAULT: '#f59e0b',
              light: '#fbbf24'
            }
          },
          fontFamily: {
            sans: ['"PingFang SC"', '"Microsoft YaHei"', '"Hiragino Sans GB"', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            card: '0 1px 3px rgba(13,28,66,.06), 0 8px 24px rgba(13,28,66,.06)'
          }
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body { -webkit-font-smoothing: antialiased; }

    /* 顶部导航栏下方悬浮热词条 */
    .hotbar {
      position: sticky;
      top: 0;
      z-index: 30;
    }
  </style>
  <script src="data.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

  <!-- ===== 顶部服务条 ===== -->
  <div class="bg-brand-900 text-brand-100 text-xs">
    <div class="max-w-7xl mx-auto px-4 h-9 flex items-center justify-between">
      <div class="flex-1 min-w-0 flex items-center">
        <div id="announcement-bar" class="flex-1 min-w-0 flex items-center">
          <span id="announcement-text" class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-accent shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            <span id="announcement-content" class="truncate"></span>
          </span>
        </div>
      </div>
      <div class="flex items-center gap-4 shrink-0">
        <span id="today-date" class="text-brand-200">2026年8月29日 星期六</span>
      </div>
    </div>
  </div>

  <!-- ===== 头部 Logo + 搜索 + 登录 ===== -->
  <header class="bg-white border-b border-slate-100">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center gap-6 flex-wrap">
      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-3 shrink-0">
        <img src="logo.png" alt="相思门户网" title="相思门户网"
             class="h-16 w-auto object-contain shrink-0"
             onerror="this.style.display='none';document.getElementById('logo-text').style.display='block';" />
        <div id="logo-text" class="leading-tight">
          <div class="text-2xl font-bold text-accent tracking-wide">相思门户网</div>
          <div class="text-[11px] text-slate-400 tracking-widest">本地视野 · 全球资讯</div>
        </div>
      </a>

      <!-- 搜索 -->
      <form id="search-form" class="flex-1 min-w-[220px] max-w-xl ml-auto">
        <div class="flex items-center bg-slate-100 rounded-full border border-slate-200 px-4 py-2 focus-within:ring-2 focus-within:ring-brand-300">
          <svg class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.3-4.3M17 10a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input id="search-input" type="text" placeholder="搜索新闻、专题、服务"
                 class="flex-1 bg-transparent outline-none text-sm px-3 placeholder:text-slate-400" />
          <button type="submit" class="text-sm font-medium text-brand-600 hover:text-brand-800 px-2">搜索</button>
        </div>
      </form>

      <!-- 登录 / 用户区 -->
      <div id="auth-area" class="flex items-center gap-3 shrink-0"></div>
    </div>
  </header>

  <!-- ===== 主导航 ===== -->
  <nav class="bg-brand-600 text-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 flex items-stretch">
      <ul id="main-nav" class="flex items-stretch overflow-x-auto">
        <li><a href="index.html" class="nav-link">首页</a></li>
        <li><a href="https://www.gov.cn/" target="_blank" class="nav-link">中国政府网</a></li>
        <li><a href="http://www.moe.gov.cn/" target="_blank" class="nav-link">教育部</a></li>
        <li><a href="http://www.shandong.gov.cn/" target="_blank" class="nav-link">山东省政府</a></li>
        <li><a href="http://edu.shandong.gov.cn/" target="_blank" class="nav-link">山东省教育厅</a></li>
        <li><a href="allnews.html" class="nav-link">全部</a></li>
      </ul>
      <div class="ml-auto flex items-center gap-3">
        <button data-auth="register" class="px-5 py-2 rounded-full text-sm font-semibold bg-white text-brand-600 hover:bg-brand-50 transition">
          注册
        </button>
      </div>
    </div>
  </nav>

  <!-- ===== 热词条 ===== -->
  <div class="hotbar bg-white border-b border-slate-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4 flex-wrap">
      <a href="topic.html" class="px-3 py-1 rounded-full bg-brand-600 text-white text-xs font-semibold hover:opacity-90 transition cursor-pointer">热门</a>
      <div id="hot-keywords" class="flex items-center gap-4 flex-wrap"></div>
      <span class="mx-2 h-4 w-px bg-slate-200 hidden md:inline-block"></span>
      <a href="topic.html" class="text-sm text-slate-600 hover:text-brand-600 transition">更多专题 ›</a>
    </div>
  </div>

  <!-- ===== 文章正文 ===== -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div id="article-container" class="bg-white rounded-xl shadow-card p-6 md:p-10 max-w-4xl mx-auto"></div>
  </main>

  <!-- ===== 底部 ===== -->
  <footer class="bg-brand-800 text-brand-100">
    <div class="max-w-7xl mx-auto px-4 py-8">
      <div class="flex items-center justify-center gap-x-8 gap-y-3 flex-wrap text-sm">
        <span class="text-brand-100">关于我们</span>
        <span class="h-4 w-px bg-brand-600"></span>
        <span class="text-brand-100">联系方式</span>
        <span class="h-4 w-px bg-brand-600"></span>
        <span class="text-brand-100">版权声明</span>
        <span class="h-4 w-px bg-brand-600"></span>
        <span class="text-brand-100">隐私政策</span>
      </div>
    </div>
    <div class="bg-brand-900">
      <div class="max-w-7xl mx-auto px-4 py-5 text-center">
        <div class="text-base font-semibold text-white tracking-widest">新闻立网 · 服务生活</div>
        <p class="mt-2 text-xs text-brand-300/80">© <span id="copyright-year">2026</span> 相思门户网 · 版权所有 · 备案号：粤ICP备00000000号</p>
      </div>
    </div>
  </footer>

  <!-- ===== 右侧悬浮按钮 ===== -->
  <div class="fixed right-4 bottom-6 flex flex-col gap-3 z-40">
    <button id="back-to-top" title="返回顶部"
            class="w-12 h-12 rounded-full bg-brand-600 text-white shadow-lg hover:bg-brand-700 transition items-center justify-center hidden">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
    </button>
    <button title="热点" class="w-12 h-12 rounded-full bg-brand-600 text-white shadow-lg hover:bg-brand-700 transition flex items-center justify-center">
      <span class="text-[11px] font-semibold">热点</span>
    </button>
    <button title="分享" class="w-12 h-12 rounded-full bg-brand-600 text-white shadow-lg hover:bg-brand-700 transition flex items-center justify-center">
      <span class="text-[11px] font-semibold">分享</span>
    </button>
  </div>

  <script>
    // ----- 今日日期 -----
    const dateEl = document.getElementById('today-date');
    const week = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    const now = new Date();
    if (dateEl) {
      dateEl.textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${week[now.getDay()]}`;
    }

    // ----- 版权年份自动更新 -----
    const copyrightYearEl = document.getElementById('copyright-year');
    if (copyrightYearEl) {
      copyrightYearEl.textContent = now.getFullYear();
    }

    // ----- 顶部公告（仅显示第一条，居左） -----
    const announcementContent = document.getElementById('announcement-content');
    if (announcementContent && announcements && announcements.length > 0) {
      announcementContent.textContent = announcements[0];
    }

    // ----- 热门搜索词渲染 -----
    const hotKeywordsWrap = document.getElementById('hot-keywords');
    if (hotKeywordsWrap) {
      hotKeywordsWrap.innerHTML = hotKeywords.map(k => `
        <a href="topic.html?category=${encodeURIComponent(k)}" class="text-sm text-slate-600 hover:text-brand-600 transition">${k}</a>
      `).join('');
    }

    // ----- 文章渲染（后端 API） -----
    const params = new URLSearchParams(window.location.search);
    const idParam = params.get('id');
    const id = Number(idParam);
    const container = document.getElementById('article-container');
    let currentArticleId = null;

    function toParagraphs(content) {
      if (Array.isArray(content)) return content;
      return String(content || '').split(/\n+/).filter(p => p.trim());
    }

    function renderArticle(article) {
      if (!container) return;
      document.title = `${article.title} - 相思门户网`;
      currentArticleId = article.id;
      container.innerHTML = `
        <nav class="text-xs text-slate-400 mb-6">
          <a href="index.html" class="hover:text-brand-600 transition">首页</a>
          <span class="mx-2">›</span>
          <span>正文</span>
        </nav>
        <h1 class="text-3xl md:text-4xl font-bold text-slate-900 leading-snug">${article.title}</h1>
        <div class="mt-4 flex items-center gap-4 text-xs text-slate-400">
          <span>发布时间：${article.time || ''}</span>
          <span>来源：${article.source || '相思门户网'}</span>
        </div>
        ${article.image ? `<img src="${article.image}" alt="${article.title}" onerror="this.style.display='none'" class="w-full h-auto rounded-xl my-6" />` : ''}
        <hr class="my-6 border-slate-100" />
        <div class="space-y-5 text-[15px] leading-7 text-slate-700">
          ${toParagraphs(article.content).map(p => `<p>${p}</p>`).join('')}
        </div>
        <div class="mt-10 pt-6 border-t border-slate-100">
          <h2 class="text-lg font-bold text-slate-800 mb-4">评论 <span id="comment-count" class="text-sm text-slate-400 font-normal"></span></h2>
          <div id="comment-list" class="space-y-4"></div>
          <div id="comment-form-area" class="mt-6"></div>
        </div>
        <div class="mt-10 pt-6 border-t border-slate-100 flex items-center justify-between">
          <a href="index.html" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-brand-600 text-white text-sm font-medium hover:bg-brand-700 transition">
            <span aria-hidden="true">←</span> 返回首页
          </a>
          <span class="text-xs text-slate-300">责任编辑：相思门户网</span>
        </div>
      `;
      initComments(article.id);
    }

    function renderNotFound() {
      if (!container) return;
      document.title = '文章不存在 - 相思门户网';
      container.innerHTML = `
        <div class="text-center py-16">
          <div class="text-5xl mb-4">📄</div>
          <h1 class="text-2xl font-bold text-slate-800">文章不存在</h1>
          <p class="mt-3 text-sm text-slate-400">抱歉，您访问的文章不存在或已被移除。</p>
          <a href="index.html" class="mt-6 inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-brand-600 text-white text-sm font-medium hover:bg-brand-700 transition">
            <span aria-hidden="true">←</span> 返回首页
          </a>
        </div>
      `;
    }

    // ----- 评论 -----
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function initComments(articleId) {
      currentArticleId = articleId;
      loadComments();
      renderCommentForm();
    }

    async function loadComments() {
      const listEl = document.getElementById('comment-list');
      const countEl = document.getElementById('comment-count');
      if (!listEl || currentArticleId == null) return;
      try {
        const comments = await api.getComments(currentArticleId);
        if (countEl) countEl.textContent = `${comments.length} 条`;
        if (!comments.length) {
          listEl.innerHTML = '<p class="text-sm text-slate-400">暂无评论，快来抢沙发～</p>';
          return;
        }
        listEl.innerHTML = comments.map(c => `
          <div class="flex gap-3">
            <div class="w-9 h-9 rounded-full bg-brand-600 text-white flex items-center justify-center text-sm font-bold shrink-0">${escapeHtml((c.username || '用').slice(0, 1))}</div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 text-sm">
                <span class="font-semibold text-slate-700">${escapeHtml(c.username)}</span>
                <span class="text-xs text-slate-400">${escapeHtml(c.time || '')}</span>
              </div>
              <p class="mt-1 text-sm text-slate-600 leading-relaxed break-words">${escapeHtml(c.content)}</p>
            </div>
          </div>
        `).join('');
      } catch (err) {
        listEl.innerHTML = `<p class="text-sm text-slate-400">评论加载失败：${escapeHtml(err.message || '请稍后重试')}</p>`;
      }
    }

    function renderCommentForm() {
      const area = document.getElementById('comment-form-area');
      if (!area) return;
      const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
      const username = localStorage.getItem('username') || '';
      if (!isLoggedIn) {
        area.innerHTML = `
          <div class="bg-slate-50 rounded-xl p-5 text-center">
            <p class="text-sm text-slate-500 mb-3">登录后即可参与评论</p>
            <button data-auth="login" class="px-5 py-2 rounded-full text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 transition">立即登录</button>
          </div>
        `;
        return;
      }
      area.innerHTML = `
        <div class="bg-slate-50 rounded-xl p-5">
          <p class="text-xs text-slate-400 mb-2">评论身份：<span class="text-brand-600 font-semibold">${escapeHtml(username)}</span></p>
          <textarea id="comment-input" rows="3" placeholder="写下你的看法…"
                    class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-200 transition resize-y"></textarea>
          <div class="mt-3 flex items-center justify-between gap-3">
            <p id="comment-error" class="text-xs text-red-500 min-h-[16px] leading-relaxed"></p>
            <button id="comment-submit" class="px-5 py-2 rounded-lg bg-brand-600 text-white text-sm font-semibold hover:bg-brand-700 transition">发表评论</button>
          </div>
        </div>
      `;
      document.getElementById('comment-submit').addEventListener('click', submitComment);
    }

    async function submitComment() {
      const input = document.getElementById('comment-input');
      const errEl = document.getElementById('comment-error');
      const username = localStorage.getItem('username') || '';
      const content = input.value.trim();
      if (!content) {
        if (errEl) errEl.textContent = '评论内容不能为空';
        return;
      }
      const btn = document.getElementById('comment-submit');
      btn.disabled = true;
      btn.textContent = '发布中...';
      try {
        await api.addComment(currentArticleId, username, content);
        input.value = '';
        if (errEl) errEl.textContent = '';
        await loadComments();
      } catch (err) {
        if (errEl) errEl.textContent = err.message || '评论失败，请稍后重试';
      } finally {
        btn.disabled = false;
        btn.textContent = '发表评论';
      }
    }

    // 登录/退出后刷新评论表单状态（auth.js 会派发 authchange 事件）
    document.addEventListener('authchange', () => {
      if (currentArticleId != null) renderCommentForm();
    });

    if (idParam === null || idParam.trim() === '' || !Number.isInteger(id)) {
      renderNotFound();
    } else {
      container.innerHTML = '<div class="text-center py-16 text-sm text-slate-400">加载中...</div>';
      api.getArticle(id)
        .then(article => {
          if (article && article.title) renderArticle(article);
          else renderNotFound();
        })
        .catch(err => {
          console.error('文章加载失败：', err);
          renderNotFound();
        });
    }

    // ----- 返回顶部 -----
    const backBtn = document.getElementById('back-to-top');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 400) {
        backBtn.classList.remove('hidden');
        backBtn.classList.add('flex');
      } else {
        backBtn.classList.add('hidden');
        backBtn.classList.remove('flex');
      }
    });
    backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // ----- 搜索（模拟） -----
    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = document.getElementById('search-input').value.trim();
      if (q) alert(`正在搜索：“${q}”`);
    });
  </script>

  <style>
    .nav-link {
      display: flex;
      align-items: center;
      height: 52px;
      padding: 0 1.25rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: rgba(255,255,255,.85);
      transition: background .2s, color .2s;
      white-space: nowrap;
    }
    .nav-link:hover { background: rgba(255,255,255,.12); color: #fff; }
  </style>
</body>
</html>
