<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>专题 - 相思门户网</title>
  <meta name="description" content="相思门户网——本地视野，全球资讯。浏览各专题系列报道。" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#eef2fb',
              100: '#dbe3f5',
              200: '#b6c4e8',
              300: '#8aa0d6',
              400: '#5a77c0',
              500: '#35539f',
              DEFAULT: '#1e3a8a',
              600: '#1e3a8a',
              700: '#173071',
              800: '#122658',
              900: '#0d1c42'
            },
            accent: {
              DEFAULT: '#f59e0b',
              light: '#fbbf24'
            }
          },
          fontFamily: {
            sans: ['"PingFang SC"', '"Microsoft YaHei"', '"Hiragino Sans GB"', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            card: '0 1px 3px rgba(13,28,66,.06), 0 8px 24px rgba(13,28,66,.06)'
          }
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body { -webkit-font-smoothing: antialiased; }

    /* 顶部导航栏下方悬浮热词条 */
    .hotbar {
      position: sticky;
      top: 0;
      z-index: 30;
    }

    /* 两行截断（正文摘要） */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
  <script src="data.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

  <!-- ===== 顶部服务条 ===== -->
  <div class="bg-brand-900 text-brand-100 text-xs">
    <div class="max-w-7xl mx-auto px-4 h-9 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <span class="flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          温馨提示：本站今日访问 1.2 万人
        </span>
        <span class="hidden sm:inline text-brand-300/80">站内信条数 1</span>
      </div>
      <div class="flex items-center gap-4">
        <span id="today-date" class="text-brand-200">2026年8月28日 星期五</span>
      </div>
    </div>
  </div>

  <!-- ===== 头部 Logo + 搜索 + 登录 ===== -->
  <header class="bg-white border-b border-slate-100">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center gap-6 flex-wrap">
      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-3 shrink-0">
        <img src="logo.png" alt="相思门户网" title="相思门户网"
             class="h-16 w-auto object-contain shrink-0"
             onerror="this.style.display='none';document.getElementById('logo-text').style.display='block';" />
        <div id="logo-text" class="leading-tight">
          <div class="text-2xl font-bold text-accent tracking-wide">相思门户网</div>
          <div class="text-[11px] text-slate-400 tracking-widest">本地视野 · 全球资讯</div>
        </div>
      </a>

      <!-- 搜索 -->
      <form id="search-form" class="flex-1 min-w-[220px] max-w-xl ml-auto">
        <div class="flex items-center bg-slate-100 rounded-full border border-slate-200 px-4 py-2 focus-within:ring-2 focus-within:ring-brand-300">
          <svg class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.3-4.3M17 10a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input id="search-input" type="text" placeholder="搜索新闻、专题、服务"
                 class="flex-1 bg-transparent outline-none text-sm px-3 placeholder:text-slate-400" />
          <button type="submit" class="text-sm font-medium text-brand-600 hover:text-brand-800 px-2">搜索</button>
        </div>
      </form>

      <!-- 登录 -->
      <button class="shrink-0 px-6 py-2 rounded-full text-sm font-semibold text-white bg-gradient-to-r from-accent to-orange-500 hover:opacity-90 transition shadow-sm">
        登录
      </button>
    </div>
  </header>

  <!-- ===== 主导航 ===== -->
  <nav class="bg-brand-600 text-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 flex items-stretch">
      <ul id="main-nav" class="flex items-stretch overflow-x-auto">
        <li><a href="index.html" class="nav-link">首页</a></li>
        <li><a href="index.html#channel-intl" class="nav-link">国际</a></li>
        <li><a href="index.html#channel-finance" class="nav-link">财经</a></li>
        <li><a href="index.html#channel-tech" class="nav-link">科技</a></li>
        <li><a href="index.html#channel-culture" class="nav-link">文化</a></li>
        <li><a href="allnews.html" class="nav-link">全部</a></li>
      </ul>
      <div class="ml-auto flex items-center gap-3">
        <button class="px-5 py-2 rounded-full text-sm font-semibold bg-white text-brand-600 hover:bg-brand-50 transition">
          注册
        </button>
      </div>
    </div>
  </nav>

  <!-- ===== 热词条（专题入口） ===== -->
  <div class="hotbar bg-white border-b border-slate-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4 flex-wrap">
      <a href="topic.html" class="px-3 py-1 rounded-full bg-brand-600 text-white text-xs font-semibold hover:opacity-90 transition cursor-pointer">热门</a>
      <div id="hot-keywords" class="flex items-center gap-4 flex-wrap"></div>
      <span class="mx-2 h-4 w-px bg-slate-200 hidden md:inline-block"></span>
      <a href="topic.html" class="text-sm text-slate-600 hover:text-brand-600 transition">全部专题 ›</a>
    </div>
  </div>

  <!-- ===== 专题文章列表 ===== -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div id="topic-container" class="max-w-4xl mx-auto"></div>
  </main>

  <!-- ===== 底部 ===== -->
  <footer class="bg-brand-800 text-brand-100">
    <div class="max-w-7xl mx-auto px-4 py-8">
      <div class="flex items-center justify-center gap-x-8 gap-y-3 flex-wrap text-sm">
        <a href="index.html" class="hover:text-white transition">关于我们</a>
        <span class="h-4 w-px bg-brand-600"></span>
        <a href="index.html" class="hover:text-white transition">联系方式</a>
        <span class="h-4 w-px bg-brand-600"></span>
        <a href="index.html" class="hover:text-white transition">版权声明</a>
        <span class="h-4 w-px bg-brand-600"></span>
        <a href="index.html" class="hover:text-white transition">隐私政策</a>
      </div>
    </div>
    <div class="bg-brand-900">
      <div class="max-w-7xl mx-auto px-4 py-5 text-center">
        <div class="text-base font-semibold text-white tracking-widest">新闻立网 · 服务生活</div>
        <p class="mt-2 text-xs text-brand-300/80">© 2026 相思门户网 · 版权所有 · 备案号：粤ICP备00000000号</p>
      </div>
    </div>
  </footer>

  <!-- ===== 右侧悬浮按钮 ===== -->
  <div class="fixed right-4 bottom-6 flex flex-col gap-3 z-40">
    <button id="back-to-top" title="返回顶部"
            class="w-12 h-12 rounded-full bg-brand-600 text-white shadow-lg hover:bg-brand-700 transition items-center justify-center hidden">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
    </button>
    <button title="热点" class="w-12 h-12 rounded-full bg-brand-600 text-white shadow-lg hover:bg-brand-700 transition flex items-center justify-center">
      <span class="text-[11px] font-semibold">热点</span>
    </button>
    <button title="分享" class="w-12 h-12 rounded-full bg-brand-600 text-white shadow-lg hover:bg-brand-700 transition flex items-center justify-center">
      <span class="text-[11px] font-semibold">分享</span>
    </button>
  </div>

  <script>
    // ----- 今日日期 -----
    const dateEl = document.getElementById('today-date');
    const week = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    const now = new Date();
    if (dateEl) {
      dateEl.textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${week[now.getDay()]}`;
    }

    // ----- 热门搜索词渲染 -----
    const hotKeywordsWrap = document.getElementById('hot-keywords');
    if (hotKeywordsWrap) {
      hotKeywordsWrap.innerHTML = hotKeywords.map(k => `
        <a href="topic.html?category=${encodeURIComponent(k)}" class="text-sm text-slate-600 hover:text-brand-600 transition">${k}</a>
      `).join('');
    }

    // ----- 专题文章渲染 -----
    const params = new URLSearchParams(window.location.search);
    const category = (params.get('category') || '').trim();

    const container = document.getElementById('topic-container');
    if (container) {
      // 全部专题：按 topic 分组展示
      if (!category) {
        document.title = '全部专题 - 相思门户网';

        const extraTopics = [...new Set(articles.map(a => a.topic))].filter(t => !hotKeywords.includes(t));
        const groups = [
          ...hotKeywords
            .map(t => ({ topic: t, list: articles.filter(a => a.topic === t) }))
            .filter(g => g.list.length > 0),
          ...extraTopics
            .map(t => ({ topic: t, list: articles.filter(a => a.topic === t) }))
            .filter(g => g.list.length > 0)
        ];

        container.innerHTML = `
          <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
            <h1 class="text-2xl font-bold text-slate-800 border-l-4 border-brand-600 pl-3">全部专题</h1>
            <span class="text-xs text-slate-400">共 ${articles.length} 篇报道 · ${groups.length} 个专题</span>
          </div>
          <div class="space-y-6">
            ${groups.map(g => `
              <section class="bg-white rounded-xl shadow-card p-6">
                <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
                  <h2 class="text-xl md:text-2xl font-bold text-brand-600 border-l-4 border-brand-600 pl-3">${g.topic}</h2>
                  <span class="text-xs text-slate-400">共 ${g.list.length} 篇</span>
                </div>
                <ul class="divide-y divide-slate-100">
                  ${g.list.map(a => `
                    <li class="py-3">
                      <a href="article.html?id=${a.id}" class="flex items-center justify-between gap-4 group">
                        <span class="flex-1 text-sm md:text-[15px] text-slate-700 group-hover:text-brand-600 transition leading-snug">${a.title}</span>
                        <span class="text-xs text-slate-400 shrink-0">${a.time}</span>
                      </a>
                    </li>
                  `).join('')}
                </ul>
                <a href="topic.html?category=${encodeURIComponent(g.topic)}" class="mt-3 inline-block text-xs text-brand-500 hover:text-brand-700 transition">进入「${g.topic}」专题 ›</a>
              </section>
            `).join('')}
          </div>
          <div class="mt-8 text-center">
            <a href="index.html" class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-brand-600 text-white text-sm font-medium hover:bg-brand-700 transition">← 返回首页</a>
          </div>
        `;
      } else {
        // 单个专题：仅显示该专题下的文章列表
        const title = category;
        const filtered = articles.filter(a => a.topic === category);
        document.title = `${title} - 相思门户网`;

        if (filtered.length > 0) {
          container.innerHTML = `
            <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
              <h1 class="text-2xl font-bold text-slate-800 border-l-4 border-brand-600 pl-3">${title}</h1>
              <span class="text-xs text-slate-400">共 ${filtered.length} 篇报道</span>
            </div>
            <div class="space-y-4">
              ${filtered.map(a => `
                <a href="article.html?id=${a.id}" class="group block bg-white rounded-xl shadow-card hover:shadow-lg transition p-5">
                  <div class="flex items-center gap-3 text-xs text-slate-400">
                    <span class="px-2 py-0.5 rounded bg-blue-50 text-brand-600">${a.topic}</span>
                    <span>发布时间：${a.time}</span>
                  </div>
                  <h3 class="mt-2 text-lg font-bold text-slate-800 group-hover:text-brand-600 transition">${a.title}</h3>
                  <p class="mt-2 text-sm text-slate-500 line-clamp-2">${a.content[0]}</p>
                  <span class="mt-3 inline-flex items-center gap-1 text-sm font-medium text-brand-600 group-hover:gap-2 transition-all">阅读全文 →</span>
                </a>
              `).join('')}
            </div>
            <div class="mt-8 text-center">
              <a href="topic.html" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-brand-600 text-white text-sm font-medium hover:bg-brand-700 transition">查看全部专题</a>
              <a href="index.html" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full border border-brand-600 text-brand-600 text-sm font-medium hover:bg-brand-50 transition">返回首页</a>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="text-center py-20 bg-white rounded-xl shadow-card">
              <div class="text-5xl mb-4">🗞️</div>
              <h2 class="text-xl font-bold text-slate-800">暂无相关报道</h2>
              <p class="mt-2 text-sm text-slate-400">“${title}”专题下暂时没有文章，敬请期待。</p>
              <div class="mt-6 flex items-center justify-center gap-4">
                <a href="topic.html" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-brand-600 text-white text-sm font-medium hover:bg-brand-700 transition">查看全部专题</a>
                <a href="index.html" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full border border-brand-600 text-brand-600 text-sm font-medium hover:bg-brand-50 transition">返回首页</a>
              </div>
            </div>
          `;
        }
      }
    }

    // ----- 返回顶部 -----
    const backBtn = document.getElementById('back-to-top');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 400) {
        backBtn.classList.remove('hidden');
        backBtn.classList.add('flex');
      } else {
        backBtn.classList.add('hidden');
        backBtn.classList.remove('flex');
      }
    });
    backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // ----- 搜索（模拟） -----
    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = document.getElementById('search-input').value.trim();
      if (q) alert(`正在搜索：“${q}”`);
    });
  </script>

  <style>
    .nav-link {
      display: flex;
      align-items: center;
      height: 52px;
      padding: 0 1.25rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: rgba(255,255,255,.85);
      transition: background .2s, color .2s;
      white-space: nowrap;
    }
    .nav-link:hover { background: rgba(255,255,255,.12); color: #fff; }
  </style>
</body>
</html>
